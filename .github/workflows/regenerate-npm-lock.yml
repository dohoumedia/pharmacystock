name: Regenerate npm lockfile

on:
  push:
    branches:
      - fix/vercel-npm-ci-lockfile

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-npm-ci-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          rm -f .github/workflows/regenerate-npm-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-npm-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "fix(deps): regenerate npm lockfile"
          git push origin HEAD:fix/vercel-npm-ci-lockfile
