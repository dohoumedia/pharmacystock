name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npx expo install --check
      - name: Dependency advisory regression
        run: npx vitest run src/navigation/dependencyAdvisories.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo-doctor
      - name: Export Web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      # Android/iOS Hermes exports remain outside this job: prior bundle passes
      # do not prove compatibility on Ubuntu with Node 22.18.0 and npm ci.
